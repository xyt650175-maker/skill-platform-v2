# 本地联调配置：使用 H2 模拟 TDSQL 的 MySQL 协议模式；生产环境使用 application.yml 中的 TDSQL 连接配置。
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:llmaif;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:db/init-local.sql
  redis:
    host: 127.0.0.1
    port: 6379

server:
  # 副本后端独立运行，避免影响原项目的 8080 服务。
  port: 8084

llmaif:
  git:
    repos-root: ${LOCAL_NAS_ROOT:./runtime/nas}/git-repos
    # 企业部署时填写内部 GitLab/Gitea 地址，例如 https://git.intra.example.com。
    # 本地联调不连接公网，关闭真实远程探测。
    enterprise-base-url: ${ENTERPRISE_GIT_BASE_URL:}
    verify-remote: false
    redis-lock-enabled: false
  security:
    credential-encryption-key: local-development-only-change-before-production
  # 本地模式写入项目内 runtime 目录；生产模式仍使用 /agent_nas 挂载点。
  nas:
    root: ${LOCAL_NAS_ROOT:./runtime/nas}
    skills-drafts: ${LOCAL_NAS_ROOT:./runtime/nas}/skills/drafts
    skills-releases: ${LOCAL_NAS_ROOT:./runtime/nas}/skills
  # 阿里云模型服务
  llm:
    base-url: ${LOCAL_LLM_BASE_URL:https://token-plan.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
    # 通过环境变量 LOCAL_LLM_API_KEY 注入；不得将真实密钥写入代码仓库。
    api-key: ${LOCAL_LLM_API_KEY:}
    api-key-required: true
    default-model: ${LOCAL_LLM_MODEL:qwen3.7-max}

management:
  health:
    redis:
      enabled: false
