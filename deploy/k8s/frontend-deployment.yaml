apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmaif-frontend
  namespace: llmaif
spec:
  replicas: 2
  selector:
    matchLabels: { app: llmaif-frontend }
  template:
    metadata:
      labels: { app: llmaif-frontend }
    spec:
      containers:
        - name: frontend
          image: registry.intra.example.com/llmaif/frontend:latest
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: llmaif-frontend, namespace: llmaif }
spec:
  selector: { app: llmaif-frontend }
  ports: [{ port: 80, targetPort: 80 }]
